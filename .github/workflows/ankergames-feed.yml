name: AnkerGames feed

# Rebuilds the AnkerGames download source once a day and publishes it on the
# "sources" branch:
# https://raw.githubusercontent.com/UzairSohail/NachoLauncher/sources/ankergames.json
on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Game pages to read for size, date and version
        default: "150"

concurrency:
  group: ankergames-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Install the browser
        run: |
          mkdir -p "$RUNNER_TEMP/scraper"
          cp scripts/ankergames-feed.mjs scripts/ankergames-feed-lib.mjs "$RUNNER_TEMP/scraper/"
          cd "$RUNNER_TEMP/scraper"
          npm init -y > /dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Fetch the published feed
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" sources > /dev/null; then
            git clone --depth 1 --branch sources "$REPO_URL" "$RUNNER_TEMP/feed"
          else
            git init -q -b sources "$RUNNER_TEMP/feed"
            git -C "$RUNNER_TEMP/feed" remote add origin "$REPO_URL"
          fi

      - name: Build the feed
        env:
          MAX_PAGES: ${{ inputs.max_pages || '150' }}
        run: node "$RUNNER_TEMP/scraper/ankergames-feed.mjs" "$RUNNER_TEMP/feed"

      - name: Publish
        working-directory: ${{ runner.temp }}/feed
        run: |
          git add ankergames.json ankergames-state.json
          if git diff --cached --quiet; then
            echo "Feed unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update AnkerGames feed"
          git push origin sources
